# Scenario 3: public domain, Caddy with automatic Let's Encrypt certificates.
# Needs KAMINO_DOMAIN in docker/.env, DNS pointing to this host, ports 80/443 reachable.
#   docker compose -f docker/compose.caddy.yml up -d --build
name: kamino

services:
  kamino:
    image: kamino:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        KAMINO_BUILD_COMMIT: ${KAMINO_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAMINO_PUBLIC_URL: https://${KAMINO_DOMAIN:?set KAMINO_DOMAIN in docker/.env}
      KAMINO_DATABASE_URL: postgres://kamino:${KAMINO_DB_PASSWORD:?set KAMINO_DB_PASSWORD in docker/.env}@postgres:5432/kamino
      KAMINO_MASTER_KEY_FILE: /run/secrets/kamino_master_key
      KAMINO_LOG_LEVEL: ${KAMINO_LOG_LEVEL:-info}
      # Only the proxy in front can reach the server: trust its X-Forwarded-For (one hop).
      KAMINO_TRUST_PROXY: ${KAMINO_TRUST_PROXY:-1}
    secrets:
      - kamino_master_key
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kamino
      POSTGRES_DB: kamino
      POSTGRES_PASSWORD: ${KAMINO_DB_PASSWORD:?set KAMINO_DB_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamino -d kamino"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - kamino
    environment:
      KAMINO_DOMAIN: ${KAMINO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  kamino_master_key:
    file: ./secrets/kamino_master_key

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
